<script>
  // DIAGNOSTIC — captures errors before anything else runs.
  window.__diagSteps = [];
  function diag(step) {
    window.__diagSteps.push(step + ' @ ' + (performance.now()|0) + 'ms');
    var d = document.getElementById('diag-banner');
    if (d) d.textContent = '[diag] ' + window.__diagSteps.join(' → ');
  }
  window.addEventListener('error', function(e) {
    diag('ERROR: ' + (e.message || 'unknown') + ' (' + (e.filename||'').split('/').pop() + ':' + e.lineno + ')');
    var d = document.getElementById('diag-banner');
    if (d) { d.style.background = '#fee'; d.style.color = '#900'; }
  });
  window.addEventListener('unhandledrejection', function(e) {
    diag('REJECTED: ' + (e.reason && e.reason.message || e.reason || 'unknown'));
  });
  diag('head-script');
</script>

<script>
const Liff = window.LiffBridge;
const Api  = window.PayrollApi;

const params = new URLSearchParams(window.location.search);
const LIFF_ID = params.get('liffId') || '2010019987-1USGaEEO';

let userIdToken = null;
let employees = [];

(async function init() {
  diag('init-start');
  try {
    diag('before-liffInit');
    await Liff.liffInit(LIFF_ID);
    diag('after-liffInit (mock=' + Liff.liffIsMock() + ')');
    if (Liff.liffIsMock()) document.getElementById('mock-banner').classList.remove('hidden');
    userIdToken = Liff.liffGetIDToken();
    diag('got-token');
    renderForm();  // render immediately — no pre-fetch
    diag('renderForm-done');
    // Background: fetch employee list to upgrade approver fields to dropdowns
    Api.apiListEmployees(userIdToken).then(list => {
      employees = list;
      upgradeApproverDropdowns();
    }).catch(err => {
      if (err.message === 'forbidden_owner_only') forbidden();
      // otherwise leave as text inputs; submit will validate
    });
  } catch (err) {
    showError(err.message);
  }
})();

function approverOptions(includeOwner) {
  const opts = [];
  if (includeOwner) opts.push(`<option value="OWNER">OWNER · เจ้าของ</option>`);
  opts.push(...employees.map(e =>
    `<option value="${e.emp_code}">${e.emp_code} · ${e.first_name} ${e.last_name} (${e.department})</option>`));
  return opts.join('');
}

function upgradeApproverDropdowns() {
  ['l1_approver', 'l2_approver', 'l3_approver'].forEach(name => {
    const input = document.querySelector(`[name="${name}"]`);
    if (!input || input.tagName === 'SELECT') return;  // already upgraded
    const isOptional = name !== 'l1_approver';
    const select = document.createElement('select');
    select.name = name;
    select.className = input.className;
    if (!isOptional) select.required = true;
    select.innerHTML = (isOptional ? '<option value="">— ไม่ระบุ —</option>' : '') + approverOptions(true);
    if (input.value) {
      const opt = select.querySelector(`option[value="${input.value}"]`);
      if (opt) opt.selected = true;
    }
    input.replaceWith(select);
  });
}

function suggestEmpCode() {
  // Without prefetched employees, just suggest EMP006 as a reasonable default;
  // the owner can override and the server enforces uniqueness.
  if (!employees.length) return 'EMP006';
  const nums = employees
    .map(e => (String(e.emp_code).match(/^EMP(\d+)$/) || [])[1])
    .filter(Boolean)
    .map(Number);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return 'EMP' + String(next).padStart(3, '0');
}

          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">

            <input name="first_name" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">นามสกุล *</label>
            <input name="last_name" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">
          </div>
        </div>
        <div>
          <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">ชื่อเล่น</label>
          <input name="nickname" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">

            <input name="position" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">

        </div>
        <div>
          <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">วันเริ่มงาน *</label>
          <input name="start_date" type="date" required value="${today}" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">
        </div>

      <!-- Approval chain -->
      <section class="bg-white rounded-xl ring-1 ring-slate-200 p-5 space-y-3">
        <p class="text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold">สายอนุมัติ</p>
        <p class="text-xs text-slate-400">กรอก emp_code (เช่น EMP001) หรือ OWNER · ระบบจะอัพเป็น dropdown ภายใน 1-2 วิ</p>
        <div>
          <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">L1 หัวหน้าทันที *</label>
          <input name="l1_approver" required value="OWNER" placeholder="OWNER หรือ EMP001"
                 class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition uppercase font-mono">
        </div>
        <div>
          <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">L2 (สำหรับลา 3-5 วัน)</label>
          <input name="l2_approver" placeholder="ปล่อยว่างถ้าไม่ใช้"
                 class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition uppercase font-mono">
        </div>
        <div>
          <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">L3 (สำหรับลา 6+ วัน)</label>
          <input name="l3_approver" placeholder="ปล่อยว่างถ้าไม่ใช้"
                 class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition uppercase font-mono">
        </div>
      </section>

      <!-- Schedule + Quota -->
      <section class="bg-white rounded-xl ring-1 ring-slate-200 p-5 space-y-3">
        <p class="text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold">ตารางทำงาน + สิทธิ์ลา</p>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">วันทำงาน (Mon-Sun)</label>
            <input name="work_days_bitmap" value="1111100" maxlength="7" pattern="[01]{7}"
                   class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition font-mono">
          </div>
          <div>
            <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">ชั่วโมง/วัน</label>
            <input name="daily_hours" type="number" value="8" min="1" max="12" step="1"
                   class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">ลาป่วย</label>
            <input name="sick_quota" type="number" value="30" min="0" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">ลากิจ</label>
            <input name="personal_quota" type="number" value="3" min="0" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">พักร้อน</label>
            <input name="vacation_quota" type="number" value="8" min="0" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">

      <!-- Salary -->

        <p class="text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold">เงินเดือน <span class="text-slate-400 normal-case tracking-normal">(secret sheet)</span></p>
        <div>
          <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">Base Salary (บาท/เดือน) *</label>
          <input name="base_salary" id="base_salary" type="number" required min="0" step="100"
                 class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition font-mono">
        </div>
        <div id="rates-preview" class="bg-slate-50 rounded-lg p-3 text-xs text-slate-500 hidden">
          <div class="grid grid-cols-2 gap-y-1">

            <span>Hourly rate</span><span class="text-right font-mono text-slate-900" id="rate-hourly">—</span>
            <span>OT 1.5×</span><span class="text-right font-mono text-slate-900" id="rate-ot1">—</span>
            <span>OT 1× (rest)</span><span class="text-right font-mono text-slate-900" id="rate-ot2">—</span>
            <span>OT 3×</span><span class="text-right font-mono text-slate-900" id="rate-ot3">—</span>

        </div>

            <span>ประกันสังคม</span>
          </label>
          <div>
            <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-1.5">PF rate</label>
            <input name="pf_rate" type="number" value="0.05" min="0" max="0.15" step="0.01"
                   class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition font-mono">
          </div>
        </div>
      </section>

      <div class="pt-1 px-1">
        <button type="submit" id="submit-btn"
                class="w-full bg-gradient-to-br from-cyan-500 to-emerald-500 text-white py-4 rounded-lg font-semibold text-sm tracking-wide uppercase shadow-lg shadow-cyan-500/30 active:scale-[0.99] disabled:from-slate-400 disabled:to-slate-400 disabled:shadow-none transition">
          สร้าง + ออก Pairing Code
        </button>
      </div>

      <p id="status-message" class="text-sm text-center min-h-[1.5em] font-medium"></p>
    </form>
  `;

  // Live rate preview
  const baseInput = document.getElementById('base_salary');
  const dailyHoursInput = document.querySelector('input[name="daily_hours"]');
  const updateRates = () => {
    const base = Number(baseInput.value);
    const dh = Number(dailyHoursInput.value) || 8;
    const preview = document.getElementById('rates-preview');
    if (!base) { preview.classList.add('hidden'); return; }
    const daily = base / 30;
    const hourly = daily / dh;
    const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    document.getElementById('rate-daily').textContent  = fmt(daily);
    document.getElementById('rate-hourly').textContent = fmt(hourly);
    document.getElementById('rate-ot1').textContent    = fmt(hourly * 1.5);
    document.getElementById('rate-ot2').textContent    = fmt(hourly * 1.0);
    document.getElementById('rate-ot3').textContent    = fmt(hourly * 3.0);
    preview.classList.remove('hidden');
  };
  baseInput.addEventListener('input', updateRates);
  dailyHoursInput.addEventListener('input', updateRates);

  // Submit
  document.getElementById('onboard-form').addEventListener('submit', onSubmit);
}

async function onSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  data.sso_eligible = form.elements['sso_eligible'].checked;
  data.base_salary = Number(data.base_salary);
  data.daily_hours = Number(data.daily_hours);
  data.pf_rate     = Number(data.pf_rate);
  data.sick_quota     = Number(data.sick_quota);
  data.personal_quota = Number(data.personal_quota);
  data.vacation_quota = Number(data.vacation_quota);

  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status-message');
  btn.disabled = true; btn.textContent = 'กำลังสร้าง...';
  status.textContent = '';

  try {
    const result = await Api.apiOnboardEmployee(data, userIdToken);
    showSuccess(result);
  } catch (err) {
    status.textContent = 'ผิดพลาด: ' + err.message;
    status.className = 'text-sm text-center min-h-[1.5em] font-medium text-red-600';
    btn.disabled = false; btn.textContent = 'สร้าง + ออก Pairing Code';
  }
}

function showSuccess(result) {
  document.getElementById('main').innerHTML = `
    <section class="bg-emerald-50 ring-1 ring-emerald-200 rounded-xl p-6 text-center">
      <p class="text-sm text-emerald-700 font-semibold uppercase tracking-wider">สร้างสำเร็จ</p>
      <p class="mt-2 text-xl font-bold text-slate-900">${result.full_name}</p>
      <p class="text-sm text-slate-500 mt-0.5">${result.emp_code}</p>
    </section>

    <section class="bg-white rounded-xl ring-1 ring-slate-200 p-6 text-center">
      <p class="text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold">Pairing Code · 24 ชม.</p>
      <p class="font-mono text-5xl font-bold tracking-[0.2em] text-cyan-700 mt-3">${result.pairing_code}</p>
      <p class="text-xs text-slate-500 mt-4 leading-relaxed">
        ส่งรหัส 6 หลักนี้ + รหัสพนักงาน <span class="font-semibold text-slate-900">${result.emp_code}</span><br>
        ให้พนักงานเปิด LIFF → "ผูกบัญชี LINE" → ใส่ทั้งสองรหัส
      </p>
    </section>

    <div class="grid grid-cols-2 gap-2">
      <a href="onboard.html" class="block text-center py-3 rounded-lg border border-slate-300 bg-white text-sm font-medium active:scale-[0.98] transition">เพิ่มอีกคน</a>
      <a href="/" class="block text-center py-3 rounded-lg bg-slate-900 text-white text-sm font-medium active:scale-[0.98] transition">กลับเมนู</a>
    </div>
  `;
}

function forbidden() {
  document.getElementById('main').innerHTML = `
    <section class="bg-white rounded-xl ring-1 ring-slate-200 p-8 text-center">
      <p class="text-base font-medium text-red-700">ไม่มีสิทธิ์เข้าถึง</p>
      <p class="text-sm text-slate-500 mt-1">หน้านี้สำหรับเจ้าของระบบเท่านั้น</p>
    </section>`;
}

function showError(msg) {
  document.getElementById('main').innerHTML = `
    <section class="bg-white rounded-xl ring-1 ring-slate-200 p-8 text-center">
      <p class="text-base font-medium text-red-700">โหลดไม่สำเร็จ</p>
      <p class="text-sm text-slate-500 mt-1 break-all">${msg}</p>
    </section>`;
}
</script>
