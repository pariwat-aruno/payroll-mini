<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>กล่องอนุมัติ — HumanAI Payroll</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<style>
  body { font-family: 'Prompt', system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
  .font-brand { font-family: 'Poppins', 'Prompt', sans-serif; }
</style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
<div class="max-w-lg mx-auto pb-10">

<!-- Mock banner -->
<div id="mock-banner" class="hidden bg-amber-100 text-amber-800 text-xs px-4 py-2 text-center font-medium">
  Local dev mode — using mock LIFF
</div>

<!-- Header -->
<header class="bg-gradient-to-br from-cyan-500 to-emerald-500 text-white px-6 pt-7 pb-10">
  <div class="flex items-center gap-3">
    <img src="logo.png" alt="HumanAI" class="w-10 h-10 rounded-lg bg-white/95 p-1 shadow-sm">
    <div class="leading-tight">
      <p class="font-brand font-bold text-lg">HumanAI</p>
      <p class="text-[11px] text-white/80">จัดการ HR ครบ จบในที่เดียว</p>
    </div>
  </div>
  <div class="mt-7">
    <p class="text-[11px] text-white/80 uppercase tracking-[0.18em] font-semibold">
      <span>กล่องอนุมัติ ·</span>
      <span id="user-greeting">กำลังโหลด</span>
    </p>
    <h1 class="mt-3 text-3xl font-bold tracking-tight">รออนุมัติ <span id="count-badge" class="text-white/70 text-xl font-medium">—</span></h1>
    <p class="text-sm text-white/85 mt-1.5">ใบลาและคำขอ OT ที่ต้องคุณตัดสินใจ</p>
  </div>
</header>

<main class="px-4 -mt-4 space-y-3">

  <!-- Reconcile control -->
  <section class="bg-white rounded-xl ring-1 ring-slate-200 p-5">
    <p class="text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-3">งวดเงินเดือน</p>
    <div class="flex items-center gap-2">
      <input type="month" id="reconcile-period"
             class="flex-1 min-w-0 appearance-none bg-white border border-slate-300 rounded-lg px-3 py-2.5 text-sm text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">
      <button id="reconcile-btn"
              class="px-4 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-medium active:scale-[0.98] disabled:bg-slate-400 transition whitespace-nowrap">
        Reconcile
      </button>
    </div>
    <p id="reconcile-status" class="text-xs text-slate-500 mt-2 min-h-[1em]"></p>
  </section>

  <!-- Inbox -->
  <div id="main" class="space-y-3">
    <section class="bg-white rounded-xl ring-1 ring-slate-200 p-8 text-center">
      <p class="text-sm text-slate-500">กำลังโหลดรายการ...</p>
    </section>
  </div>
</main>
</div>

<script src="liff-bridge.js"></script>
<script src="api.js"></script>
<script>
const Liff = window.LiffBridge;
const Api  = window.PayrollApi;

const params = new URLSearchParams(window.location.search);
const LIFF_ID = params.get('liffId') || '2010019987-1USGaEEO';

let userIdToken = null;

const LEAVE_LABEL = { sick: 'ลาป่วย', personal: 'ลากิจ', vacation: 'พักร้อน', unpaid: 'ลาไม่รับเงิน' };
const OT_LABEL = { weekday: 'ล่วงเวลา', rest: 'ทำงานวันหยุด', holiday: 'ล่วงเวลาในวันหยุด' };
const OT_RATE = { weekday: '1.5×', rest: '+1×', holiday: '3×' };

function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = String(s).split('-');
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

async function init() {
  try {
    await Liff.liffInit(LIFF_ID);
    if (Liff.liffIsMock()) document.getElementById('mock-banner').classList.remove('hidden');
    const profile = await Liff.liffGetProfile();
    userIdToken = Liff.liffGetIDToken();
    document.getElementById('user-greeting').textContent = profile.displayName;

    // Default reconcile period = previous month
    const today = new Date();
    const prev = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    document.getElementById('reconcile-period').value =
      `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
    document.getElementById('reconcile-btn').addEventListener('click', onReconcile);

    await loadInbox();
  } catch (err) {
    showError(err.message);
  }
}

async function onReconcile() {
  const btn = document.getElementById('reconcile-btn');
  const status = document.getElementById('reconcile-status');
  const period = document.getElementById('reconcile-period').value;
  if (!period) { status.textContent = 'กรุณาเลือกงวด'; return; }

  btn.disabled = true;
  btn.textContent = 'กำลังรัน...';
  status.textContent = '';

  try {
    const result = await Api.apiPost('runReconcile', { period }, userIdToken);
    status.textContent = `เสร็จ — ${result.reconciledRows} แถว · ${result.openEscalations} escalation เปิด · Flex สรุปส่งเข้า LINE แล้ว`;
    status.className = 'text-xs text-emerald-700 mt-2 min-h-[1em] font-medium';
  } catch (err) {
    status.textContent = 'ผิดพลาด: ' + err.message;
    status.className = 'text-xs text-red-600 mt-2 min-h-[1em] font-medium';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Reconcile';
  }
}

async function loadInbox() {
  const main = document.getElementById('main');
  const badge = document.getElementById('count-badge');
  main.innerHTML = `<section class="bg-white rounded-xl ring-1 ring-slate-200 p-8 text-center">
    <p class="text-sm text-slate-500">กำลังโหลดรายการ...</p></section>`;
  badge.textContent = '—';

  try {
    const items = await Api.apiListPendingApprovals(userIdToken);
    badge.textContent = items.length;

    if (items.length === 0) {
      main.innerHTML = `<section class="bg-white rounded-xl ring-1 ring-slate-200 p-8 text-center">
        <p class="text-base font-medium text-slate-700">ไม่มีคำขอรออนุมัติ</p>
        <p class="text-sm text-slate-400 mt-1">เคลียร์หมดทุกอย่างแล้ว 👌</p></section>`;
      return;
    }

    main.innerHTML = items.map((it, idx) => renderCard(it, idx)).join('');

    document.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', () => onAct(btn));
    });
  } catch (err) {
    showError(err.message);
  }
}

function renderCard(it, idx) {
  const isLeave = it.kind === 'leave';
  const typeLabel = isLeave ? (LEAVE_LABEL[it.leave_type] || it.leave_type) : (OT_LABEL[it.ot_type] || it.ot_type);
  const detailLine = isLeave
    ? (it.start_date === it.end_date
        ? `${fmtDate(it.start_date)} · ${it.days} วัน`
        : `${fmtDate(it.start_date)} – ${fmtDate(it.end_date)} · ${it.days} วัน`)
    : `${fmtDate(it.date)} · ${it.start_time}–${it.end_time}`;
  const fullName = `${it.first_name} ${it.last_name}`.trim() || it.emp_code;
  const subtitle = [it.department, it.position].filter(Boolean).join(' · ') || it.emp_code;
  const levelTag = `L${it.level}/${it.required_levels}`;
  const rateBadge = !isLeave ? `<span class="text-[11px] text-cyan-700 ml-1">${OT_RATE[it.ot_type] || ''}</span>` : '';

  return `
    <section class="bg-white rounded-xl ring-1 ring-slate-200 p-5" data-card="${idx}">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="font-semibold text-slate-900 truncate">${fullName}</p>
          <p class="text-xs text-slate-500 truncate">${subtitle}</p>
        </div>
        <div class="flex flex-col items-end gap-1 text-right">
          <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium">${levelTag}</span>
          ${it.is_backdated ? '<span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-medium">ย้อนหลัง</span>' : ''}
        </div>
      </div>

      <div class="mt-3 pt-3 border-t border-slate-100 space-y-1.5">
        <p class="text-sm font-medium text-slate-900">
          ${isLeave ? 'ใบลา' : 'ขอ OT'} · ${typeLabel}${rateBadge}
        </p>
        <p class="text-sm text-slate-600">${detailLine}</p>
        ${it.reason ? `<p class="text-sm text-slate-500">${escapeHtml(it.reason)}</p>` : ''}
      </div>

      <div class="mt-4 grid grid-cols-2 gap-2">
        <button data-act="reject" data-idx="${idx}" data-id="${it.id}" data-kind="${it.kind}" data-level="${it.level}"
                class="py-2.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-medium active:scale-[0.98] transition">
          ปฏิเสธ
        </button>
        <button data-act="approve" data-idx="${idx}" data-id="${it.id}" data-kind="${it.kind}" data-level="${it.level}"
                class="py-2.5 rounded-lg bg-emerald-600 text-white text-sm font-semibold active:scale-[0.98] shadow-sm transition">
          อนุมัติ
        </button>
      </div>

      <p class="text-xs text-center text-slate-400 mt-3 hidden" data-status="${idx}"></p>
    </section>
  `;
}

async function onAct(btn) {
  const idx = btn.dataset.idx;
  const card = document.querySelector(`[data-card="${idx}"]`);
  const status = card.querySelector(`[data-status]`);
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  status.classList.remove('hidden');
  status.textContent = 'กำลังบันทึก...';
  status.className = 'text-xs text-center text-slate-400 mt-3';

  try {
    const result = await Api.apiActOnApproval({
      kind: btn.dataset.kind,
      decision: btn.dataset.act,
      id: btn.dataset.id,
      level: Number(btn.dataset.level),
    }, userIdToken);

    const verb = btn.dataset.act === 'approve' ? 'อนุมัติ' : 'ปฏิเสธ';
    status.textContent = `${verb}แล้ว · status: ${result.status}`;
    status.className = 'text-xs text-center text-emerald-600 mt-3 font-medium';
    card.classList.add('opacity-50');

    // Refresh list after short delay
    setTimeout(loadInbox, 800);
  } catch (err) {
    status.textContent = 'ผิดพลาด: ' + err.message;
    status.className = 'text-xs text-center text-red-600 mt-3 font-medium';
    card.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showError(msg) {
  const main = document.getElementById('main');
  if (msg === 'forbidden_owner_only') {
    main.innerHTML = `<section class="bg-white rounded-xl ring-1 ring-slate-200 p-8 text-center">
      <p class="text-base font-medium text-red-700">ไม่มีสิทธิ์เข้าถึง</p>
      <p class="text-sm text-slate-500 mt-1">หน้านี้สำหรับเจ้าของระบบเท่านั้น</p></section>`;
  } else {
    main.innerHTML = `<section class="bg-white rounded-xl ring-1 ring-slate-200 p-8 text-center">
      <p class="text-base font-medium text-red-700">โหลดไม่สำเร็จ</p>
      <p class="text-sm text-slate-500 mt-1 break-all">${escapeHtml(msg)}</p></section>`;
  }
}

init();
</script>
</body>
</html>
