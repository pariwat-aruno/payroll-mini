<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ส่งใบลา — Payroll Mini</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<style>
  body { font-family: 'Prompt', system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
  .font-brand { font-family: 'Poppins', 'Prompt', sans-serif; }
  /* iOS Safari: stable width regardless of empty/filled state, min-height 44px touch target,
     16px font-size avoids auto-zoom on focus */
  input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    min-height: 44px;
    box-sizing: border-box;
    font-size: 16px;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
</style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
<div class="max-w-lg mx-auto pb-10">

<!-- Mock banner -->
<div id="mock-banner" class="hidden bg-amber-100 text-amber-800 text-xs px-4 py-2 text-center font-medium">
  Local dev mode — using mock LIFF
</div>

<!-- Header -->
<header class="bg-gradient-to-br from-cyan-500 to-emerald-500 text-white px-6 pt-7 pb-10">
  <div class="flex items-center gap-3">
    <img src="logo.png" alt="HumanAI" class="w-10 h-10 rounded-lg bg-white/95 p-1 shadow-sm">
    <div class="leading-tight">
      <p class="font-brand font-bold text-lg">HumanAI</p>
      <p class="text-[11px] text-white/80">จัดการ HR ครบ จบในที่เดียว</p>
    </div>
  </div>
  <div class="mt-7">
    <p class="text-[11px] text-white/80 uppercase tracking-[0.18em] font-semibold">
      <span>สวัสดี ·</span>
      <span id="user-greeting">กำลังโหลด</span>
    </p>
    <h1 class="mt-3 text-3xl font-bold tracking-tight">ส่งใบลา</h1>
    <p class="text-sm text-white/85 mt-1.5">กรอกฟอร์มเพื่อขออนุมัติ</p>
  </div>
</header>

<main class="px-4 -mt-4 space-y-3">

<!-- Quota -->
<section class="bg-white rounded-xl ring-1 ring-slate-200 p-5">
  <p class="text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-4">สิทธิ์ลาคงเหลือ</p>
  <div id="quota-display" class="grid grid-cols-3 divide-x divide-slate-200">
    <div class="col-span-3 text-center text-sm text-slate-500 py-3">
      กำลังโหลด...
    </div>
  </div>
</section>

<form id="leave-form" class="space-y-3">

  <!-- Type pick -->
  <section class="bg-white rounded-xl ring-1 ring-slate-200 p-5">
    <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-3">ประเภทการลา</label>
    <div class="grid grid-cols-2 gap-2.5" id="type-buttons">
      <button type="button" data-type="sick"     class="leave-type-btn py-3.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-medium transition active:scale-[0.98]">ลาป่วย</button>
      <button type="button" data-type="personal" class="leave-type-btn py-3.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-medium transition active:scale-[0.98]">ลากิจ</button>
      <button type="button" data-type="vacation" class="leave-type-btn py-3.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-medium transition active:scale-[0.98]">พักร้อน</button>
      <button type="button" data-type="unpaid"   class="leave-type-btn py-3.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-medium transition active:scale-[0.98]">ไม่รับเงิน</button>
    </div>
    <input type="hidden" name="leave_type" id="leave_type" required>
  </section>

  <!-- Dates -->
  <section class="bg-white rounded-xl ring-1 ring-slate-200 p-5">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-2">วันที่เริ่มลา</label>
        <input type="date" name="start_date" id="start_date" required
               class="block w-full min-w-0 appearance-none bg-white border border-slate-300 rounded-lg px-3 py-3 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">
      </div>
      <div>
        <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-2">วันที่สิ้นสุด</label>
        <input type="date" name="end_date" id="end_date" required
               class="block w-full min-w-0 appearance-none bg-white border border-slate-300 rounded-lg px-3 py-3 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition">
      </div>
    </div>
    <p id="day-count" class="text-sm font-semibold text-cyan-700 min-h-[1.25em] mt-4"></p>
  </section>

  <!-- Reason -->
  <section class="bg-white rounded-xl ring-1 ring-slate-200 p-5">
    <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-2">
      เหตุผล <span class="text-red-500 normal-case tracking-normal">*</span>
    </label>
    <textarea name="reason" id="reason" rows="3" required minlength="3"
              class="w-full bg-white border border-slate-300 rounded-lg p-3 text-base text-slate-900 resize-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition"
              placeholder="ระบุเหตุผลสั้นๆ (อย่างน้อย 3 ตัวอักษร)"></textarea>
  </section>

  <!-- Evidence -->
  <section class="bg-white rounded-xl ring-1 ring-slate-200 p-5 space-y-3">
    <div>
      <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-2">
        ประเภทหลักฐาน
      </label>
      <select name="evidence_type" id="evidence_type"
              class="w-full bg-white border border-slate-300 rounded-lg p-3 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition"
              style="font-size:16px">
        <option value="none">ไม่มี</option>
        <option value="medical_cert">ใบรับรองแพทย์</option>
        <option value="appointment">ใบนัด</option>
        <option value="receipt">ใบเสร็จ</option>
        <option value="photo">รูปถ่าย</option>
        <option value="chat_screenshot">chat screenshot</option>
        <option value="other">อื่นๆ</option>
      </select>
    </div>
    <div id="evidence-link-wrap">
      <label class="block text-[11px] text-slate-500 uppercase tracking-[0.18em] font-semibold mb-2">
        ลิงก์หลักฐาน <span class="text-slate-400 normal-case tracking-normal">(Google Drive / Photos)</span>
      </label>
      <input type="url" name="evidence_url" id="evidence_url"
             class="w-full bg-white border border-slate-300 rounded-lg p-3 text-base text-slate-900 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-100 focus:outline-none transition disabled:bg-slate-100 disabled:text-slate-400"
             placeholder="https://...">
    </div>
    <label id="evidence-pending-wrap" class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
      <input type="checkbox" name="evidence_pending" id="evidence_pending"
             class="w-4 h-4 rounded border-slate-300 text-cyan-600 focus:ring-cyan-500">
      <span>ส่งภายหลัง (ยังไม่มีลิงก์ตอนนี้)</span>
    </label>
  </section>

  <!-- Submit -->
  <div class="pt-1 px-1">
    <button type="submit" id="submit-btn"
            class="w-full bg-gradient-to-br from-cyan-500 to-emerald-500 text-white py-4 rounded-lg font-semibold text-sm tracking-wide uppercase shadow-lg shadow-cyan-500/30 active:scale-[0.99] disabled:from-slate-400 disabled:to-slate-400 disabled:shadow-none transition">
      ส่งใบลา
    </button>
  </div>

  <p id="status-message" class="text-sm text-center min-h-[1.5em] font-medium"></p>
</form>

</main>
</div>

<script src="liff-bridge.js"></script>
<script src="api.js"></script>
<script>
const Liff = window.LiffBridge;
const Api  = window.PayrollApi;

const params = new URLSearchParams(window.location.search);
const LIFF_ID = params.get('liffId') || '2010019987-1USGaEEO';

let userIdToken = null;

async function init() {
  try {
    await Liff.liffInit(LIFF_ID);
    if (Liff.liffIsMock()) {
      document.getElementById('mock-banner').classList.remove('hidden');
    }
    const profile = await Liff.liffGetProfile();
    userIdToken = Liff.liffGetIDToken();
    document.getElementById('user-greeting').textContent = profile.displayName;
    await loadQuota();
  } catch (err) {
    setStatus('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
  }
}

async function loadQuota() {
  const display = document.getElementById('quota-display');
  try {
    const quota = await Api.apiGetMyQuota(userIdToken);
    if (!quota) {
      display.innerHTML = '<div class="col-span-3 text-center text-sm text-slate-500 py-3">ยังไม่ได้กำหนดสิทธิ์</div>';
      return;
    }
    const types = [
      { key: 'sick',     label: 'ลาป่วย'  },
      { key: 'personal', label: 'ลากิจ'   },
      { key: 'vacation', label: 'พักร้อน' },
    ];
    display.innerHTML = types.map(t => {
      const q = quota[t.key];
      const numColor = q.remain === 0 ? 'text-red-600' :
                        q.remain <= 2 ? 'text-amber-600' :
                                        'text-slate-900';
      return `
        <div class="text-center px-2">
          <p class="text-[10px] text-slate-500 uppercase tracking-wider">${t.label}</p>
          <p class="text-3xl font-bold ${numColor} mt-1.5 leading-none">${q.remain}</p>
          <p class="text-[11px] text-slate-400 mt-1">จาก ${q.quota}</p>
        </div>`;
    }).join('');
  } catch (err) {
    display.innerHTML = `<div class="col-span-3 text-center text-sm text-red-600 py-3">โหลดสิทธิ์ไม่ได้</div>`;
  }
}

// === Type button highlight ===
document.querySelectorAll('.leave-type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.leave-type-btn').forEach(b => {
      b.classList.remove('bg-cyan-600', 'text-white', 'border-cyan-600', 'shadow-sm');
      b.classList.add('bg-white', 'text-slate-700', 'border-slate-300');
    });
    btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-300');
    btn.classList.add('bg-cyan-600', 'text-white', 'border-cyan-600', 'shadow-sm');
    document.getElementById('leave_type').value = btn.dataset.type;
  });
});

// === Day count ===
function updateDayCount() {
  const s = document.getElementById('start_date').value;
  const e = document.getElementById('end_date').value;
  const out = document.getElementById('day-count');
  if (!s || !e) { out.textContent = ''; return; }
  const days = Math.round((new Date(e) - new Date(s)) / 86400000) + 1;
  if (days < 1) {
    out.textContent = 'วันที่สิ้นสุดต้องไม่น้อยกว่าวันที่เริ่ม';
    out.className = 'text-sm font-semibold text-red-600 min-h-[1.25em]';
  } else {
    out.textContent = `รวม ${days} วัน`;
    out.className = 'text-sm font-semibold text-cyan-700 min-h-[1.25em]';
  }
}
document.getElementById('start_date').addEventListener('change', updateDayCount);
document.getElementById('end_date').addEventListener('change', updateDayCount);

// === Evidence type → toggle URL field + pending checkbox ===
function updateEvidenceUI() {
  const type = document.getElementById('evidence_type').value;
  const urlInput = document.getElementById('evidence_url');
  const pendingWrap = document.getElementById('evidence-pending-wrap');
  const pendingCb = document.getElementById('evidence_pending');
  const linkWrap = document.getElementById('evidence-link-wrap');

  if (type === 'none') {
    urlInput.disabled = true;
    urlInput.value = '';
    linkWrap.classList.add('opacity-50');
    pendingWrap.classList.add('hidden');
    pendingCb.checked = false;
  } else {
    linkWrap.classList.remove('opacity-50');
    pendingWrap.classList.remove('hidden');
    urlInput.disabled = pendingCb.checked;
    if (pendingCb.checked) urlInput.value = '';
  }
}
document.getElementById('evidence_type').addEventListener('change', updateEvidenceUI);
document.getElementById('evidence_pending').addEventListener('change', updateEvidenceUI);
updateEvidenceUI();

// === Submit ===
document.getElementById('leave-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status-message');
  status.textContent = '';
  status.className = 'text-sm text-center min-h-[1.5em] font-medium';

  const evidenceType = document.getElementById('evidence_type').value;
  const evidencePending = document.getElementById('evidence_pending').checked;
  const data = {
    leave_type: document.getElementById('leave_type').value,
    start_date: document.getElementById('start_date').value,
    end_date:   document.getElementById('end_date').value,
    reason:     document.getElementById('reason').value,
    evidence_type: evidenceType,
    evidence_pending: evidenceType !== 'none' && evidencePending,
    evidence_url: (evidenceType === 'none' || evidencePending) ? '' : document.getElementById('evidence_url').value,
  };

  if (!data.leave_type) { setStatus('กรุณาเลือกประเภทการลา', 'error'); return; }
  if (!data.reason || data.reason.trim().length < 3) {
    setStatus('กรุณาระบุเหตุผลอย่างน้อย 3 ตัวอักษร', 'error');
    document.getElementById('reason').focus();
    return;
  }
  if (new Date(data.end_date) < new Date(data.start_date)) {
    setStatus('วันที่สิ้นสุดต้องไม่น้อยกว่าวันที่เริ่ม', 'error'); return;
  }

  btn.disabled = true;
  btn.textContent = 'กำลังส่ง...';

  try {
    const result = await Api.apiSubmitLeave(data, userIdToken);
    setStatus(`ส่งใบลาสำเร็จ ${result.count} วัน`, 'success');
    btn.textContent = 'ส่งแล้ว';
    setTimeout(() => Liff.liffClose(), 1500);
  } catch (err) {
    setStatus('ส่งไม่สำเร็จ: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'ส่งใบลา';
  }
});

function setStatus(text, kind) {
  const el = document.getElementById('status-message');
  el.textContent = text;
  el.className = 'text-sm text-center min-h-[1.5em] font-medium ' +
    (kind === 'error' ? 'text-red-600' : kind === 'success' ? 'text-emerald-600' : '');
}

init();
</script>
</body>
</html>
