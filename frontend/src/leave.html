<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ส่งใบลา — Payroll Mini</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body { font-family: 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
  /* Make iOS native date inputs look consistent */
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<div class="max-w-lg mx-auto pb-10">

<!-- Mock banner -->
<div id="mock-banner" class="hidden bg-amber-100 text-amber-800 text-xs px-4 py-2 text-center font-medium">
  ⚙️ Local dev mode — using mock LIFF
</div>

<!-- Header (gradient hero) -->
<header class="bg-gradient-to-br from-indigo-500 to-indigo-700 text-white px-6 pt-8 pb-14 rounded-b-3xl shadow-lg">
  <div class="flex items-center gap-3">
    <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-2xl">
      👋
    </div>
    <div>
      <p class="text-xs text-white/80">สวัสดี</p>
      <p id="user-greeting" class="text-lg font-semibold leading-tight">กำลังโหลด...</p>
    </div>
  </div>
  <h1 class="mt-6 text-3xl font-bold">ส่งใบลา</h1>
  <p class="text-sm text-white/80 mt-1">กรอกฟอร์มเพื่อขออนุมัติ</p>
</header>

<main class="px-4 -mt-8 space-y-4">

<!-- Quota card -->
<section class="bg-white rounded-2xl shadow-sm p-5">
  <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold mb-3">สิทธิ์ลาคงเหลือ · ปีนี้</p>
  <div id="quota-display" class="grid grid-cols-3 gap-2">
    <div class="col-span-3 bg-slate-100 rounded-xl p-4 text-center text-sm text-slate-500">
      กำลังโหลด...
    </div>
  </div>
</section>

<!-- Form -->
<form id="leave-form" class="space-y-4">

  <!-- Type pick -->
  <section class="bg-white rounded-2xl shadow-sm p-5">
    <label class="block text-sm font-semibold mb-3">ประเภทการลา</label>
    <div class="grid grid-cols-2 gap-3" id="type-buttons">
      <button type="button" data-type="sick" class="leave-type-btn flex flex-col items-center gap-1 p-4 rounded-xl border-2 border-slate-200 bg-white transition active:scale-95">
        <span class="text-3xl leading-none">🤒</span>
        <span class="text-sm font-medium">ลาป่วย</span>
      </button>
      <button type="button" data-type="personal" class="leave-type-btn flex flex-col items-center gap-1 p-4 rounded-xl border-2 border-slate-200 bg-white transition active:scale-95">
        <span class="text-3xl leading-none">☕</span>
        <span class="text-sm font-medium">ลากิจ</span>
      </button>
      <button type="button" data-type="vacation" class="leave-type-btn flex flex-col items-center gap-1 p-4 rounded-xl border-2 border-slate-200 bg-white transition active:scale-95">
        <span class="text-3xl leading-none">🏖️</span>
        <span class="text-sm font-medium">พักร้อน</span>
      </button>
      <button type="button" data-type="unpaid" class="leave-type-btn flex flex-col items-center gap-1 p-4 rounded-xl border-2 border-slate-200 bg-white transition active:scale-95">
        <span class="text-3xl leading-none">💸</span>
        <span class="text-sm font-medium">ไม่รับเงิน</span>
      </button>
    </div>
    <input type="hidden" name="leave_type" id="leave_type" required>
  </section>

  <!-- Dates -->
  <section class="bg-white rounded-2xl shadow-sm p-5 space-y-4">
    <div>
      <label class="block text-sm font-semibold mb-2">วันที่เริ่มลา</label>
      <input type="date" name="start_date" id="start_date" required
             class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-base focus:border-indigo-500 focus:bg-white focus:outline-none transition">
    </div>
    <div>
      <label class="block text-sm font-semibold mb-2">วันที่สิ้นสุด</label>
      <input type="date" name="end_date" id="end_date" required
             class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-base focus:border-indigo-500 focus:bg-white focus:outline-none transition">
    </div>
    <p id="day-count" class="text-sm font-semibold text-indigo-600 min-h-[1.25em]"></p>
  </section>

  <!-- Reason -->
  <section class="bg-white rounded-2xl shadow-sm p-5">
    <label class="block text-sm font-semibold mb-2">เหตุผล</label>
    <textarea name="reason" id="reason" rows="3"
              class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 text-base resize-none focus:border-indigo-500 focus:bg-white focus:outline-none transition"
              placeholder="ระบุเหตุผลสั้นๆ"></textarea>
  </section>

  <!-- Evidence -->
  <section class="bg-white rounded-2xl shadow-sm p-5">
    <label class="block text-sm font-semibold mb-2">
      แนบหลักฐาน <span class="text-slate-400 font-normal">(ถ้ามี)</span>
    </label>
    <input type="url" name="evidence_url" id="evidence_url"
           class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 text-base focus:border-indigo-500 focus:bg-white focus:outline-none transition"
           placeholder="ลิงก์ Google Drive / Photos">
    <p class="text-xs text-slate-400 mt-2">เช่น ใบรับรองแพทย์ (ลาป่วยเกิน 3 วัน)</p>
  </section>

  <!-- Submit -->
  <div class="pt-1">
    <button type="submit" id="submit-btn"
            class="w-full bg-gradient-to-br from-indigo-500 to-indigo-700 text-white py-4 rounded-2xl font-semibold text-base shadow-lg shadow-indigo-500/30 active:scale-[0.98] disabled:from-slate-300 disabled:to-slate-400 disabled:shadow-none transition">
      ส่งใบลา
    </button>
  </div>

  <p id="status-message" class="text-sm text-center min-h-[1.5em] font-medium"></p>
</form>

</main>
</div>

<script src="liff-bridge.js"></script>
<script src="api.js"></script>
<script>
const Liff = window.LiffBridge;
const Api  = window.PayrollApi;

const params = new URLSearchParams(window.location.search);
const LIFF_ID = params.get('liffId') || '2010019987-1USGaEEO';

let userIdToken = null;

async function init() {
  try {
    await Liff.liffInit(LIFF_ID);
    if (Liff.liffIsMock()) {
      document.getElementById('mock-banner').classList.remove('hidden');
    }
    const profile = await Liff.liffGetProfile();
    userIdToken = Liff.liffGetIDToken();
    document.getElementById('user-greeting').textContent = profile.displayName;
    await loadQuota();
  } catch (err) {
    setStatus('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
  }
}

async function loadQuota() {
  const display = document.getElementById('quota-display');
  try {
    const quota = await Api.apiGetMyQuota(userIdToken);
    if (!quota) {
      display.innerHTML = '<div class="col-span-3 bg-slate-100 rounded-xl p-4 text-center text-sm text-slate-500">ยังไม่ได้กำหนดสิทธิ์</div>';
      return;
    }
    const types = [
      { key: 'sick',     label: 'ป่วย',    icon: '🤒', tone: 'amber'   },
      { key: 'personal', label: 'กิจ',     icon: '☕', tone: 'sky'     },
      { key: 'vacation', label: 'พักร้อน', icon: '🏖️', tone: 'emerald' },
    ];
    const TONE = {
      amber:   { bg: 'bg-amber-50',   num: 'text-amber-700'   },
      sky:     { bg: 'bg-sky-50',     num: 'text-sky-700'     },
      emerald: { bg: 'bg-emerald-50', num: 'text-emerald-700' },
    };
    display.innerHTML = types.map(t => {
      const q = quota[t.key];
      const c = TONE[t.tone];
      const numColor = q.remain === 0 ? 'text-red-600' : c.num;
      return `
        <div class="${c.bg} rounded-xl p-3 text-center">
          <div class="text-2xl leading-none mb-1">${t.icon}</div>
          <p class="text-xs text-slate-500">${t.label}</p>
          <p class="text-2xl font-bold ${numColor} leading-tight">${q.remain}</p>
          <p class="text-xs text-slate-400">/ ${q.quota}</p>
        </div>`;
    }).join('');
  } catch (err) {
    display.innerHTML = `<div class="col-span-3 bg-red-50 rounded-xl p-4 text-center text-sm text-red-600">โหลดสิทธิ์ไม่ได้</div>`;
  }
}

// === Type button highlight ===
document.querySelectorAll('.leave-type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.leave-type-btn').forEach(b => {
      b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600', 'shadow-md', 'shadow-indigo-500/30');
      b.classList.add('bg-white', 'border-slate-200');
    });
    btn.classList.remove('bg-white', 'border-slate-200');
    btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600', 'shadow-md', 'shadow-indigo-500/30');
    document.getElementById('leave_type').value = btn.dataset.type;
  });
});

// === Day count ===
function updateDayCount() {
  const s = document.getElementById('start_date').value;
  const e = document.getElementById('end_date').value;
  const out = document.getElementById('day-count');
  if (!s || !e) { out.textContent = ''; return; }
  const days = Math.round((new Date(e) - new Date(s)) / 86400000) + 1;
  if (days < 1) {
    out.textContent = '⚠ วันที่สิ้นสุดต้องไม่น้อยกว่าวันที่เริ่ม';
    out.className = 'text-sm font-semibold text-red-600 min-h-[1.25em]';
  } else {
    out.textContent = `รวม ${days} วัน`;
    out.className = 'text-sm font-semibold text-indigo-600 min-h-[1.25em]';
  }
}
document.getElementById('start_date').addEventListener('change', updateDayCount);
document.getElementById('end_date').addEventListener('change', updateDayCount);

// === Submit ===
document.getElementById('leave-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status-message');
  status.textContent = '';
  status.className = 'text-sm text-center min-h-[1.5em] font-medium';

  const data = {
    leave_type: document.getElementById('leave_type').value,
    start_date: document.getElementById('start_date').value,
    end_date:   document.getElementById('end_date').value,
    reason:     document.getElementById('reason').value,
    evidence_url: document.getElementById('evidence_url').value,
  };

  if (!data.leave_type) { setStatus('กรุณาเลือกประเภทการลา', 'error'); return; }
  if (new Date(data.end_date) < new Date(data.start_date)) {
    setStatus('วันที่สิ้นสุดต้องไม่น้อยกว่าวันที่เริ่ม', 'error'); return;
  }

  btn.disabled = true;
  btn.textContent = 'กำลังส่ง...';

  try {
    const result = await Api.apiSubmitLeave(data, userIdToken);
    setStatus(`✓ ส่งใบลาสำเร็จ ${result.count} วัน`, 'success');
    btn.textContent = 'ส่งแล้ว';
    setTimeout(() => Liff.liffClose(), 1500);
  } catch (err) {
    setStatus('ส่งไม่สำเร็จ: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'ส่งใบลา';
  }
});

function setStatus(text, kind) {
  const el = document.getElementById('status-message');
  el.textContent = text;
  el.className = 'text-sm text-center min-h-[1.5em] font-medium ' +
    (kind === 'error' ? 'text-red-600' : kind === 'success' ? 'text-emerald-600' : '');
}

init();
</script>
</body>
</html>
